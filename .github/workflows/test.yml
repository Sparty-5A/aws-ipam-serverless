name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Black (code formatter check)
      run: |
        black --check . || true

    - name: Run Pylint (linting)
      run: |
        pylint lambda_functions infrastructure --exit-zero || true

    - name: Run Bandit (security scan)
      run: |
        bandit -r lambda_functions infrastructure || true

    - name: Run unit tests
      run: |
        pytest tests/unit --cov=lambda_functions --cov=infrastructure || true

    - name: Run integration tests
      run: |
        pytest tests/integration --cov=lambda_functions || true
      env:
        AWS_DEFAULT_REGION: us-east-1

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml
